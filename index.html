<html lang="en">
<head>
<meta charset="utf-8">

<title>NYS Designated Centers Map</title>
<style>
:root {
  --navy:#0b2545; --blue:#1769aa; --blue2:#2f80c9; --sky:#eaf5ff;
  --ink:#203040; --muted:#6b7f93; --line:#dce6ef; --bg:#f4f7fa; --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;overflow:hidden}
button,input{font:inherit}
#sidebar{width:380px;min-width:340px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh}
#top{padding:22px 18px 17px;background:linear-gradient(135deg,#0b2545,#1769aa);color:#fff;box-shadow:0 5px 18px #0b25452a;z-index:5}
#top h1{margin:0;font-size:23px;letter-spacing:-.4px}
#top p{margin:6px 0 4px;color:#d9eaf7;font-size:13px}
.error-link{display:inline-block;margin-top:3px;color:#fff;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:2px;opacity:.95}
.error-link:hover{opacity:1;color:#fff}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.stat{padding:5px 9px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff25;font-size:11px;font-weight:700}
#search{width:100%;height:44px;margin-top:14px;border:0;border-radius:9px;padding:0 13px;outline:none;color:var(--ink);background:#fff}
#filters{padding:12px 14px 5px;border-bottom:1px solid var(--line);background:#fff}
.filter-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:6px}
.filter{border:1px solid var(--line);background:#fff;color:#50687d;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.filter:hover{border-color:#8fbfe2;background:#f2f9ff}
.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}
.filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:999px;background:#edf3f8;color:#3e617d;font-size:10px;font-weight:800}
.filter.active .filter-count{background:rgba(255,255,255,.2);color:#fff}
#count{font-size:12px;color:var(--muted);padding:10px 15px 4px;font-weight:700}
#list{overflow:auto;padding:7px 14px 18px;flex:1}
.hospital{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:7px;color:var(--ink);cursor:pointer}
.hospital:hover{background:#eef7ff;border-color:#9bc7e8}
.hospital.selected{background:#e8f4ff;border:2px solid #2580c8;padding:11px 12px}
.hospital-name{font-size:13px;font-weight:650;line-height:1.35}
.hospital-arrow{font-size:22px;color:#8ba4b8}
#none{display:none;text-align:center;color:var(--muted);padding:25px}
#main{flex:1;min-width:0;height:100vh;padding:14px;display:flex;flex-direction:column;gap:14px}
#mapbox{flex:1;min-height:300px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 5px 20px #16324a12;position:relative}
#map{width:100%;height:100%;border:0}
.map-note{position:absolute;top:12px;left:12px;z-index:2;background:#fffdd;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;color:#50687d;box-shadow:0 2px 9px #0002}
#info{height:285px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 5px 20px #16324a12}
#info-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:13px}
#info h2{margin:0;font-size:20px;color:var(--navy)}
.badge{display:inline-block;padding:5px 8px;background:var(--sky);color:var(--blue);border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(200px,1fr));gap:9px}
.row{border:1px solid var(--line);background:#fafcfe;border-radius:8px;padding:9px 11px}
.label{display:block;font-size:10px;font-weight:800;color:#71879a;text-transform:uppercase;margin-bottom:3px}
.value{font-size:13px;font-weight:600;line-height:1.4}
.empty{color:#aab9c6;font-weight:normal}
@media(max-width:900px){
body{display:block;overflow:auto}
#sidebar{width:100%;height:45vh}
#main{height:55vh;min-height:530px}
}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>

      <button class="filter" data-filter="SAFE Designated Hospital" type="button"><span>SAFE</span><b class="filter-count"></b></button>
    </div>
  </div>
  <div id="count"></div>
  <div id="list">

  </div>
</aside>

<main id="main">

  </section>
</main>

var list=document.getElementById("list");
var search=document.getElementById("search");
var count=document.getElementById("count");
var none=document.getElementById("none");
var map=document.getElementById("map");
var info=document.getElementById("info");
var activeFilter="All";
var buttons={};

function hasDesignation(h,label){return h.designations[label] && h.designations[label].length>0}

function makeButton(h){
  var b=document.createElement("button");
  b.type="button"; b.className="hospital"; b.dataset.id=h.id;
  var n=document.createElement("span"); n.className="hospital-name"; n.textContent=h.name;
  var a=document.createElement("span"); a.className="hospital-arrow"; a.textContent="›";
  b.appendChild(n); b.appendChild(a);
  b.addEventListener("click",function(){selectHospital(h.id)});
  buttons[h.id]=b;
  return b;
}

function renderList(){
  Object.keys(buttons).forEach(function(k){buttons[k].remove()});
  buttons={};
  var q=search.value.trim().toLowerCase();
  var visible=[];
  hospitals.forEach(function(h){
    var nameMatch=h.name.toLowerCase().indexOf(q)!==-1;
    var filterMatch=activeFilter==="All" || hasDesignation(h,activeFilter);
    if(nameMatch && filterMatch) visible.push(h);
  });
  visible.forEach(function(h){list.appendChild(makeButton(h))});
  none.style.display=visible.length?"none":"block";
  count.textContent=visible.length+" hospital"+(visible.length===1?"":"s")+" shown";
}

function selectHospital(id){
  var h=hospitals.find(function(x){return x.id===id});
  if(!h)return;
  Object.keys(buttons).forEach(function(k){buttons[k].classList.remove("selected")});
  if(buttons[id]) buttons[id].classList.add("selected");

  map.src="https://www.google.com/maps?q="+encodeURIComponent(h.name+" New York")+"&output=embed";
  info.innerHTML="";
  var head=document.createElement("div"); head.id="info-head";
  var title=document.createElement("h2"); title.textContent=h.name;
  var badge=document.createElement("span"); badge.className="badge"; badge.textContent="Hospital Designations";
  head.appendChild(title); head.appendChild(badge); info.appendChild(head);

  var grid=document.createElement("div"); grid.className="grid";
  Object.keys(h.designations).forEach(function(label){
    var vals=h.designations[label];
    var row=document.createElement("div"); row.className="row";
    var l=document.createElement("span"); l.className="label"; l.textContent=label;
    var v=document.createElement("span"); v.className="value"+(vals.length?"":" empty");
    v.textContent=vals.length?vals.join(", "):"-";
    row.appendChild(l); row.appendChild(v); grid.appendChild(row);
  });
  info.appendChild(grid);
}

document.querySelectorAll(".filter").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".filter").forEach(function(x){x.classList.remove("active")});
    btn.classList.add("active");
    activeFilter=btn.dataset.filter;
    renderList();
  });
});
search.addEventListener("input",renderList);

var filterCounts = {
  "All": hospitals.length,
  "Stroke Center": hospitals.filter(function(h){return hasDesignation(h,"Stroke Center")}).length,
  "Perinatal Center": hospitals.filter(function(h){return hasDesignation(h,"Perinatal Center")}).length,
  "Trauma Center": hospitals.filter(function(h){return hasDesignation(h,"Trauma Center")}).length,
  "Burn Center": hospitals.filter(function(h){return hasDesignation(h,"Burn Center")}).length,
  "AIDS Center": hospitals.filter(function(h){return hasDesignation(h,"AIDS Center")}).length,
  "SAFE Designated Hospital": hospitals.filter(function(h){return hasDesignation(h,"SAFE Designated Hospital")}).length
};

document.querySelectorAll(".filter").forEach(function(btn){
  var key = btn.dataset.filter;
  var badge = btn.querySelector(".filter-count");
  if (badge) badge.textContent = filterCounts[key] || 0;
});

renderList();
})();
</script>
